<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CA DMV Written Test Practicer</title>
  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #888;
      --border: #e0e0e0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    header h1 { font-size: 1.1rem; font-weight: 600; }
    header .badge { font-size: 0.85rem; color: var(--text-secondary); }

    .main {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .hero {
      background: var(--card);
      border-radius: 0.5rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .hero h2 { font-size: 1.25rem; margin-bottom: 0.75rem; }
    .hero p { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1rem; }

    .btn {
      padding: 0.7rem 1.4rem;
      border: none;
      border-radius: 0.4rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #eaeaea; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { opacity: 0.9; }
    .btn-dontknow { background: transparent; color: var(--text-secondary); border: 1px dashed var(--border); }
    .btn-dontknow:hover { border-color: var(--text-secondary); color: var(--text); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .stat {
      background: var(--card);
      border-radius: 0.4rem;
      padding: 1.25rem 0.75rem;
      text-align: center;
    }

    .stat .value { font-size: 1.5rem; font-weight: 700; }
    .stat .label { font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.15rem; text-transform: uppercase; letter-spacing: 0.03em; }

    .quick-start {
      background: var(--card);
      border-radius: 0.4rem;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
    }

    .quick-start h3 { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-secondary); }

    .quick-buttons { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }

    .quick-btn {
      padding: 0.65rem 1.1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.4rem;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--text);
    }

    .quick-btn:hover { border-color: var(--primary); color: var(--primary); }

    .quick-btn-row {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .quick-btn-row + .quick-btn-row {
      margin-top: 0.5rem;
    }

    /* Test */
    .progress-bar {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 1.25rem;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      transition: width 0.2s;
    }

    .question-card {
      background: var(--card);
      border-radius: 0.5rem;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }

    .question-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
    }

    .question-text { font-size: 1.15rem; font-weight: 500; margin-bottom: 1.25rem; line-height: 1.5; }

    .options { display: flex; flex-direction: column; gap: 0.6rem; }

    .option-btn {
      display: flex;
      align-items: center;
      padding: 0.85rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.4rem;
      cursor: pointer;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .option-btn:hover:not(.disabled) { border-color: var(--primary); }
    .option-btn.selected { border-color: var(--primary); background: #eef4ff; }
    .option-btn.correct { border-color: var(--success); background: #f0fdf4; }
    .option-btn.incorrect { border-color: var(--danger); background: #fef2f2; }
    .option-btn.disabled { cursor: default; }

    .option-letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      margin-right: 0.85rem;
      flex-shrink: 0;
    }

    .option-btn.correct .option-letter { background: var(--success); color: white; }
    .option-btn.incorrect .option-letter { background: var(--danger); color: white; }
    .option-btn.selected .option-letter { background: var(--primary); color: white; }

    .feedback {
      margin-top: 0.75rem;
      padding: 0.85rem 1rem;
      border-radius: 0.4rem;
      font-size: 0.9rem;
    }

    .feedback.correct { background: #f0fdf4; color: #166534; }
    .feedback.incorrect { background: #fef2f2; color: #991b1b; }

    .nav-row {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    .nav-row .spacer { flex: 1; }

    /* Results */
    .results-card {
      background: var(--card);
      border-radius: 0.5rem;
      padding: 2rem 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .results-card h2 { font-size: 1.25rem; margin-bottom: 0.75rem; }

    .score-display {
      font-size: 3rem;
      font-weight: 700;
      margin: 1rem 0;
    }

    .score-display.pass { color: var(--success); }
    .score-display.fail { color: var(--danger); }

    .verdict {
      padding: 0.5rem 1.25rem;
      border-radius: 0.4rem;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 1rem;
    }

    .verdict.pass { background: #f0fdf4; color: var(--success); }
    .verdict.fail { background: #fef2f2; color: var(--danger); }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
    }

    .results-table th,
    .results-table td {
      padding: 0.6rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .results-table th { color: var(--text-secondary); font-weight: 500; }

    .review-item {
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      border-radius: 0.4rem;
      margin-bottom: 0.6rem;
      font-size: 0.9rem;
    }

    .review-item .q { font-weight: 500; margin-bottom: 0.4rem; line-height: 1.4; }
    .review-item .a { color: var(--text-secondary); line-height: 1.5; font-size: 0.85rem; }
    .review-item .correct-text { color: var(--success); }
    .review-item .incorrect-text { color: var(--danger); }

    @media (max-width: 640px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .main { padding: 1rem; }
      .hero, .question-card, .results-card { padding: 1.25rem; }
      .question-text { font-size: 1.05rem; }
    }
  </style>
</head>

  <main class="main" id="mainContent"></main>

      { origin: "CA DMV Official", question: "What should you do when reaching an intersection where a person operating a motorized wheelchair has entered the crosswalk?", options: ["Remain stopped behind the crosswalk line until the motorized wheelchair has safely finished crossing", "Honk to alert the pedestrian to move faster", "Proceed slowly around the wheelchair"], correct: "Remain stopped behind the crosswalk line until the motorized wheelchair has safely finished crossing" },

      { origin: "CA DMV Official", question: "Any driver who willfully flees or attempts to evade law enforcement, during which a person is seriously injured, is subject to:", options: ["Imprisonment in a state prison for up to seven years", "A fine of up to $5,000 and license suspension", "Community service and mandatory driving school"], correct: "Imprisonment in a state prison for up to seven years" },
      { origin: "CA DMV Official", question: "What should a driver do who is stopped at an intersection and wants to make a left turn?", options: ["Give the right-of-way to any approaching vehicle that is close enough to be dangerous", "Proceed immediately since you arrived first", "Honk to signal your intent and then turn"], correct: "Give the right-of-way to any approaching vehicle that is close enough to be dangerous" },

      { origin: "Driving-Tests.org", question: "On a two-way roadway with a center lane, drivers from either direction can _________ from the center lane.", options: ["park", "make left turns and U-turns", "make right turns"], correct: "make left turns and U-turns" },

      { origin: "FirstTimeDriver.com", question: "Where is it legal to make a U-turn?", options: ["Across a double yellow line", "On a divided highway with a center divider", "On a one-way street", "Both A and B are correct", "In a residential area"], correct: "In a residential area" },
      { origin: "FirstTimeDriver.com", question: "When parking at a colored curb, white means:", options: ["You can park for a limited time, which is determined by nearby signs", "You cannot stop at all", "You can park if you are disabled or driving someone who is", "You can stop long enough to pick up or drop off passengers or mail"], correct: "You can stop long enough to pick up or drop off passengers or mail" },
      { origin: "FirstTimeDriver.com", question: "How far away must you be from the car in front of you to stop safely in an emergency?", options: ["1 second", "3 seconds", "5 seconds", "7 seconds"], correct: "3 seconds" },
      { origin: "Coastline Academy", question: "Do not use your high beams when you are less than 300 feet behind another vehicle, or within 500 feet of an oncoming car.", options: ["True", "False"], correct: "True" },
      { origin: "Coastline Academy", question: "Air bags are designed to provide protection over and above what the seat belt provides.", options: ["True", "False"], correct: "True" },
      { origin: "Coastline Academy", question: "The heat caused by the friction of moving engine parts and the explosion of gasoline in the cylinders is removed through the vehicle's cooling system.", options: ["True", "False"], correct: "True" },
      { origin: "Coastline Academy", question: "The steering wheel is connected to and controls the direction of the rear wheels.", options: ["True", "False"], correct: "False" },
      { origin: "Coastline Academy", question: "Do not solely rely on the side view mirrors to give you the complete picture, since all cars have blind spots. The driver should also look over the appropriate shoulder before starting the maneuver.", options: ["True", "False"], correct: "True" },
      { origin: "Coastline Academy", question: "To get a permit you must be at least 15 1/2 years old, and your parent(s) or guardian have signed the DL 44 form.", options: ["False", "True"], correct: "True" },
      { origin: "Coastline Academy", question: "The written test for provisional license applicants has 46 questions; a maximum of _________ errors is allowed.", options: ["8", "10", "5"], correct: "8" },
      { origin: "Coastline Academy", question: "If your driver's license is lost or damaged, you must go to a DMV office and pay the required fee for a duplicate.", options: ["False", "True"], correct: "True" },
      { origin: "Coastline Academy", question: "Your driver license will be suspended for being unable to show proof of financial responsibility (insurance) when involved in an accident.", options: ["False", "True"], correct: "True" },
      { origin: "Coastline Academy", question: "The court will suspend, restrict, delay, or revoke your driving privileges for one year if you are convicted of being a habitual truant from school.", options: ["False", "True"], correct: "True" },
      { origin: "Coastline Academy", question: "If you take a non-English or oral test, you must also complete an additional test of your ability to recognize the meaning of common traffic signs in English.", options: ["False", "True"], correct: "True" },
      { origin: "Coastline Academy", question: "When you apply for an original Driver License or Identification card, you must present an acceptable birth date/legal presence document and provide your social security number (SSN).", options: ["False", "True"], correct: "True" },
      { origin: "Coastline Academy", question: "If you are at least 18 years old, meet the application requirements, and pass the required tests, you may be issued a California instruction permit. Your accompanying driver must be _________ or older and have a valid California driver license.", options: ["21 years of age", "25 years of age", "18 years of age"], correct: "18 years of age" },
      { origin: "Coastline Academy", question: "To determine the length of the suspension, the Hearing Officer starts out with a base point suspension period of:", options: ["6 months", "3 months", "1 year", "2 months"], correct: "6 months" },
      { origin: "Coastline Academy", question: "The California Vehicle Code contains the laws and regulations governing the licensing process, the expiration and renewal of a driver license, and the suspension and revocation of a driver license.", options: ["False", "True"], correct: "True" },
      { origin: "Coastline Academy", question: "Emancipated minors are exempt from minor's driver license restrictions.", options: ["False", "True"], correct: "True" },
      { origin: "Coastline Academy", question: "Physical factors that may cause accidents includes the following except:", options: ["Being angry", "Illness", "Medications"], correct: "Being angry" },
      { origin: "Coastline Academy", question: "The speed limit is ___ MPH at intersections during the last 100 feet approaching the intersection if you cannot see the other roadways entering the intersection or in an alley way.", options: ["35", "15", "25"], correct: "25" },
      { origin: "Coastline Academy", question: "A laned roadway has at least two clearly marked lanes for traffic going in one direction of the roadway.", options: ["False", "True"], correct: "True" },
      { origin: "Coastline Academy", question: "The law prohibits anyone under the age of 18 from using any type of wireless device while driving, except in an emergency situation.", options: ["False", "True"], correct: "True" },
      { origin: "Coastline Academy", question: "If a child is under the age of eight and less than 4 feet 9 inches in height, the child must be put in an approved safety seat in the front seat of a vehicle.", options: ["False", "True"], correct: "False" },
      { origin: "Coastline Academy", question: "You may legally flash your headlights under certain circumstances to get the attention of another driver who may not see you.", options: ["False", "True"], correct: "True" },
      { origin: "Coastline Academy", question: "Unless otherwise posted, the maximum speed limit is ___ mph on a two-lane undivided highway and for vehicles towing trailers.", options: ["55", "65", "70"], correct: "55" },
      { origin: "Coastline Academy", question: "If you need corrective eyeglasses or lenses for driving it's important to wear them because:", options: ["Seeing clearly is part of safe driving.", "Your license may be suspended or revoked if you are stopped and found to not be wearing the eye wear that's indicated on your license.", "Both are true."], correct: "Both are true." },
      { origin: "Coastline Academy", question: "Traffic accidents are the least cause of death in the United States.", options: ["False", "True"], correct: "False" },
      { origin: "Coastline Academy", question: "Automobile signals are the lighting devices that allow you to inform other drivers on the roadway what your intentions are.", options: ["False", "True"], correct: "True" },
      { origin: "Coastline Academy", question: "Proper positioning of the hands in the steering wheel is that the left hand is positioned at 10 o'clock and the right hand is positioned at 2 o'clock of the steering wheel.", options: ["False", "True"], correct: "False" },
      { origin: "Coastline Academy", question: "Brown is used as background color for guide and information signs related to points of recreational or cultural interest and on some street name signs.", options: ["False", "True"], correct: "True" },
      { origin: "Coastline Academy", question: "If an oncoming vehicle has started to turn left in front of you:", options: ["Slow or stop your car to prevent a collision", "Honk your horn to warn the driver and maintain your speed.", "Maintain your speed and take your right-of-way"], correct: "Slow or stop your car to prevent a collision" },
      { origin: "Coastline Academy", question: "If two vehicles enter an intersection from different directions at the same time and the intersection is controlled by stop signs in all directions or the signal light is not working, the driver on the ___ has the right of way.", options: ["none - just proceed when the coast is clear", "left", "right"], correct: "right" },
      { origin: "Coastline Academy", question: "The purpose of antilock brake systems (ABSs) is to prevent the brakes from becoming locked.", options: ["False", "True"], correct: "True" },
      { origin: "Coastline Academy", question: "The purpose of the point count system is to alert drivers when they are in danger of being classified as a Negligent Operator of a motor vehicle.", options: ["False", "True"], correct: "True" },
      { origin: "Coastline Academy", question: "___ factors are conditions inside of your vehicle, such as distracting passengers, loud music, and doing other things while driving, that may cause you to drive unsafely.", options: ["Physical", "Psychological", "Environmental"], correct: "Environmental" },
      { origin: "Coastline Academy", question: "If you are in an intersection and see an emergency vehicle, stop immediately and give them the right-of-way.", options: ["False", "True"], correct: "False" }
    ];

    const PASS_THRESHOLD = 0.826;

    let state = {
      phase: 'welcome',
      testQuestions: [],
      currentIndex: 0,
      answers: {},
      answered: false,
      questionCount: 5,
      exitPending: false,
      stats: { tests: 0, passed: 0, failed: 0, scores: [], totalCorrect: 0, totalWrong: 0 }
    };

    const main = document.getElementById('mainContent');
    document.getElementById('questionCount').textContent = `${QUESTIONS.length} questions`;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startTest(count) {
      state.questionCount = count || state.questionCount;
      state.testQuestions = shuffle(QUESTIONS).slice(0, state.questionCount);
      state.currentIndex = 0;
      state.answers = {};
      state.answered = false;
      state.exitPending = false;
      state.phase = 'test';
      render();
    }

    function selectAnswer(qIndex, option) {
      if (state.answered) return;
      state.answers[qIndex] = option;
      state.answered = true;
      render();
    }

    function dontKnow(qIndex) {
      if (state.answered) return;
      state.answers[qIndex] = '__SKIP__';
      state.answered = true;
      render();
    }

    function nextQuestion() {
      if (state.currentIndex < state.testQuestions.length - 1) {
        state.currentIndex++;
        state.answered = state.answers[state.currentIndex] !== undefined;
        render();
      } else {
        finishTest();
      }
    }

    function prevQuestion() {
      if (state.currentIndex > 0) {
        state.currentIndex--;
        state.answered = state.answers[state.currentIndex] !== undefined;
        render();
      }
    }

    function handleExit() {
      if (state.exitPending) {
        state.phase = 'welcome';
        state.testQuestions = [];
        state.currentIndex = 0;
        state.answers = {};
        state.answered = false;
        state.exitPending = false;
        render();
      } else {
        state.exitPending = true;
        render();
      }
    }

    function finishTest() {
      let correct = 0;
      state.testQuestions.forEach((q, i) => {
        if (state.answers[i] === q.correct) correct++;
      });
      const score = correct / state.testQuestions.length;
      const passed = score >= PASS_THRESHOLD;

      state.stats.tests++;
      if (passed) state.stats.passed++;
      else state.stats.failed++;
      state.stats.scores.push(score);
      state.stats.totalCorrect += correct;
      state.stats.totalWrong += state.testQuestions.length - correct;

      state.phase = 'results';
      state.result = { correct, total: state.testQuestions.length, score, passed };
      render();
    }

    function render() {
      if (state.phase === 'welcome') renderWelcome();
      else if (state.phase === 'test') renderTest();
      else if (state.phase === 'results') renderResults();
    }

    function renderWelcome() {
      const s = state.stats;

      main.innerHTML = `
        <div class="hero" style="text-align:center">
          <h2>CA DMV Practice Test</h2>
          <p>Choose how many questions to practice:</p>
          <div class="quick-btn-row">
            <button class="quick-btn" onclick="startTest(5)">5</button>
            <button class="quick-btn" onclick="startTest(10)">10</button>
            <button class="quick-btn" onclick="startTest(20)">20</button>
          </div>
          <div class="quick-btn-row">
            <button class="quick-btn" onclick="startTest(36)">36 (18+)</button>
            <button class="quick-btn" onclick="startTest(47)">47 (Under 18)</button>
          </div>
          <div style="font-size:0.75rem;color:var(--text-secondary);margin-top:0.75rem">
            18+: 36 questions, need 30 correct &nbsp;·&nbsp; Under 18: 46 questions, need 38 correct
          </div>
        </div>

        <div class="stats-row">
          <div class="stat"><div class="value">${QUESTIONS.length}</div><div class="label">Questions</div></div>
          <div class="stat"><div class="value">${s.tests}</div><div class="label">Tests Taken</div></div>
          <div class="stat"><div class="value">${s.totalCorrect}</div><div class="label">Correct</div></div>
          <div class="stat"><div class="value">${s.totalWrong}</div><div class="label">Wrong</div></div>
        </div>
      `;
    }

    function renderTest() {
      const q = state.testQuestions[state.currentIndex];
      const total = state.testQuestions.length;
      const idx = state.currentIndex;
      const progress = ((idx + 1) / total) * 100;
      const letters = ['A', 'B', 'C', 'D'];

      let optionsHtml = q.options.map((opt, i) => {
        let cls = 'option-btn';
        if (state.answered) {
          cls += ' disabled';
          if (opt === q.correct) cls += ' correct';
          else if (opt === state.answers[idx] && opt !== q.correct) cls += ' incorrect';
        } else if (state.answers[idx] === opt) {
          cls += ' selected';
        }
        return `<button class="${cls}" onclick="selectAnswer(${idx}, '${opt.replace(/'/g, "\\'")}')">
          <span class="option-letter">${letters[i]}</span>
          <span>${opt}</span>
        </button>`;
      }).join('');

      let feedbackHtml = '';
      if (state.answered) {
        const userAns = state.answers[idx];
        const isCorrect = userAns === q.correct;
        if (userAns === '__SKIP__') {
          feedbackHtml = `<div class="feedback incorrect">Skipped. The correct answer is: <strong>${q.correct}</strong></div>`;
        } else {
          feedbackHtml = `<div class="feedback ${isCorrect ? 'correct' : 'incorrect'}">
            ${isCorrect ? 'Correct!' : `Incorrect. The correct answer is: <strong>${q.correct}</strong>`}
          </div>`;
        }
      }

      main.innerHTML = `
        <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
        <div class="question-card">
          <div class="question-meta">
            <span>Question ${idx + 1} of ${total}</span>
            <span>${q.origin}</span>
          </div>
          <div class="question-text">${q.question}</div>
          <div class="options">${optionsHtml}</div>
          ${!state.answered ? `<button class="btn btn-dontknow" style="margin-top: 0.75rem;" onclick="dontKnow(${idx})">I don't know</button>` : ''}
          ${feedbackHtml}
        </div>
        <div class="nav-row">
          <button class="btn btn-secondary" onclick="prevQuestion()" ${idx === 0 ? 'disabled' : ''}>Previous</button>
          <button class="btn btn-primary" onclick="nextQuestion()" ${!state.answered ? 'disabled' : ''}>
            ${idx === total - 1 ? 'Finish' : 'Next'}
          </button>
          <span class="spacer"></span>
          <button class="btn btn-danger" onclick="handleExit()">${state.exitPending ? 'Confirm Exit' : 'Exit'}</button>
        </div>
      `;
    }

    function renderResults() {
      const r = state.result;
      const pct = Math.round(r.score * 100);
      const needed = Math.ceil(r.total * PASS_THRESHOLD);

      let reviewHtml = state.testQuestions.map((q, i) => {
        const userAns = state.answers[i];
        const isCorrect = userAns === q.correct;
        const isSkipped = userAns === '__SKIP__';
        return `<div class="review-item">
          <div class="q">${i + 1}. ${q.question}</div>
          <div class="a">
            Your answer: <span class="${isCorrect ? 'correct-text' : 'incorrect-text'}">${isSkipped ? 'Skipped' : (userAns || 'Not answered')}</span>
            ${!isCorrect ? `<br>Correct: <span class="correct-text">${q.correct}</span>` : ''}
          </div>
        </div>`;
      }).join('');

      main.innerHTML = `
        <div class="results-card">
          <h2>Test Complete</h2>
          <div class="score-display ${r.passed ? 'pass' : 'fail'}">${pct}%</div>
          <div class="verdict ${r.passed ? 'pass' : 'fail'}">${r.passed ? 'PASSED' : 'FAILED'}</div>
          <div style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 1rem;">
            ${r.correct} correct out of ${r.total} questions
          </div>
          <table class="results-table">
            <tr><th>Score</th><td>${pct}%</td><td style="color: var(--text-secondary)">Need ${Math.round(PASS_THRESHOLD * 100)}%</td></tr>
            <tr><th>Correct</th><td>${r.correct}</td><td style="color: var(--text-secondary)">Need ${needed}</td></tr>
            <tr><th>Wrong</th><td>${r.total - r.correct}</td><td style="color: var(--text-secondary)">Max ${r.total - needed} allowed</td></tr>
          </table>
          <button class="btn btn-primary" onclick="state.phase='welcome';state.exitPending=false;render()">Back to Home</button>
        </div>
        <div style="font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem;">Review</div>
        ${reviewHtml}
      `;
    }

    render();
  </script>
</body>
