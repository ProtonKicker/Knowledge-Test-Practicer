<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CA DMV Written Test Practicer</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #f9fafb;
      --card: #ffffff;
      --text: #111827;
      --text-secondary: #6b7280;
      --border: #e5e7eb;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: var(--primary);
      color: white;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 1.25rem; font-weight: 600; }
    header .badge { font-size: 0.875rem; opacity: 0.8; }

    .main {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Dashboard */
    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .hero h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .hero p { color: var(--text-secondary); font-size: 1rem; margin-bottom: 1.25rem; }

    .hero-controls {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .hero-controls label { font-size: 1rem; color: var(--text-secondary); }
    .hero-controls input[type="range"] { width: 160px; height: 6px; }
    .hero-controls .count { font-size: 1.5rem; font-weight: 700; min-width: 32px; text-align: center; }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-dontknow { background: transparent; color: var(--text-secondary); border: 1px dashed var(--border); }
    .btn-dontknow:hover { border-color: var(--text-secondary); color: var(--text); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      text-align: center;
    }

    .stat .value { font-size: 2rem; font-weight: 700; }
    .stat .label { font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem; }

    .quick-start {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem 2rem;
      margin-bottom: 2rem;
    }

    .quick-start h3 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }

    .quick-buttons { display: flex; gap: 0.75rem; flex-wrap: wrap; }

    .quick-btn {
      padding: 0.75rem 1.25rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
    }

    .quick-btn:hover { border-color: var(--primary); background: #eff6ff; }

    /* Test */
    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      margin-bottom: 1.5rem;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 3px;
      transition: width 0.2s;
    }

    .question-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    .question-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }

    .question-text { font-size: 1.25rem; font-weight: 500; margin-bottom: 1.5rem; line-height: 1.5; }

    .options { display: flex; flex-direction: column; gap: 0.75rem; }

    .option-btn {
      display: flex;
      align-items: center;
      padding: 1rem 1.25rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      cursor: pointer;
      text-align: left;
      font-size: 1rem;
      line-height: 1.4;
    }

    .option-btn:hover:not(.disabled) { border-color: var(--primary); }
    .option-btn.selected { border-color: var(--primary); background: #eff6ff; }
    .option-btn.correct { border-color: var(--success); background: #f0fdf4; }
    .option-btn.incorrect { border-color: var(--danger); background: #fef2f2; }
    .option-btn.disabled { cursor: default; }

    .option-letter {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.875rem;
      font-weight: 600;
      margin-right: 1rem;
      flex-shrink: 0;
    }

    .option-btn.correct .option-letter { background: var(--success); color: white; }
    .option-btn.incorrect .option-letter { background: var(--danger); color: white; }
    .option-btn.selected .option-letter { background: var(--primary); color: white; }

    .feedback {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 0.5rem;
      font-size: 1rem;
    }

    .feedback.correct { background: #f0fdf4; color: #166534; }
    .feedback.incorrect { background: #fef2f2; color: #991b1b; }

    .nav-row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .nav-row .spacer { flex: 1; }

    /* Results */
    .results-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 2.5rem 2rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    .results-card h2 { font-size: 1.5rem; margin-bottom: 0.75rem; }

    .score-display {
      font-size: 3.5rem;
      font-weight: 700;
      margin: 1.25rem 0;
    }

    .score-display.pass { color: var(--success); }
    .score-display.fail { color: var(--danger); }

    .verdict {
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 1.25rem;
    }

    .verdict.pass { background: #f0fdf4; color: var(--success); }
    .verdict.fail { background: #fef2f2; color: var(--danger); }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }

    .results-table th,
    .results-table td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .results-table th { color: var(--text-secondary); font-weight: 500; }

    .review-item {
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      margin-bottom: 0.75rem;
      font-size: 1rem;
    }

    .review-item .q { font-weight: 500; margin-bottom: 0.5rem; line-height: 1.4; }
    .review-item .a { color: var(--text-secondary); line-height: 1.5; }
    .review-item .correct-text { color: var(--success); }
    .review-item .incorrect-text { color: var(--danger); }

    @media (max-width: 640px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .main { padding: 1rem; }
      .hero, .question-card, .results-card { padding: 1.25rem; }
      .question-text { font-size: 1.125rem; }
    }
  </style>
</head>

  <main class="main" id="mainContent"></main>

  <script>

      { origin: "CA DMV Official", question: "What should you do when there is a school bus ahead that starts flashing yellow warning lights?", options: ["Slow down and prepare to stop", "Stop immediately and remain stopped", "Cautiously pass the school bus on the left"], correct: "Slow down and prepare to stop" },
      { origin: "CA DMV Official", question: "Which of the following is a requirement of California's Basic Speed Law?", options: ["Always drive the speed limit, regardless of conditions", "Match your speed to that of your surrounding traffic", "Never drive faster than is safe for current conditions"], correct: "Never drive faster than is safe for current conditions" },

      { origin: "CA DMV Official", question: "What should you do when reaching an intersection where a person operating a motorized wheelchair has entered the crosswalk?", options: ["Remain stopped behind the crosswalk line until the motorized wheelchair has safely finished crossing", "Honk to alert the pedestrian to move faster", "Proceed slowly around the wheelchair"], correct: "Remain stopped behind the crosswalk line until the motorized wheelchair has safely finished crossing" },

      { origin: "CA DMV Official", question: "What is one of the most common causes of traffic collisions?", options: ["Driver distractions", "Vehicle mechanical failures", "Poor road conditions"], correct: "Driver distractions" },
      { origin: "CA DMV Official", question: "Any driver who willfully flees or attempts to evade law enforcement, during which a person is seriously injured, is subject to:", options: ["Imprisonment in a state prison for up to seven years", "A fine of up to $5,000 and license suspension", "Community service and mandatory driving school"], correct: "Imprisonment in a state prison for up to seven years" },
      { origin: "CA DMV Official", question: "What should a driver do who is stopped at an intersection and wants to make a left turn?", options: ["Give the right-of-way to any approaching vehicle that is close enough to be dangerous", "Proceed immediately since you arrived first", "Honk to signal your intent and then turn"], correct: "Give the right-of-way to any approaching vehicle that is close enough to be dangerous" },

      { origin: "CA DMV Official", question: "Which of the following should you do if you are being followed by a tailgater?", options: ["Change lanes and allow the tailgater to pass", "Brake suddenly to teach them a lesson", "Speed up to increase the distance"], correct: "Change lanes and allow the tailgater to pass" },
      { origin: "CA DMV Official", question: "When you are driving the speed limit, you can be given a speeding ticket:", options: ["If road or weather conditions require a slower speed", "If you are driving in the left lane", "If other drivers are going faster than you"], correct: "If road or weather conditions require a slower speed" },
      { origin: "CA DMV Official", question: "Which lights should be used if a driver is having trouble seeing other vehicles because of dust or smoke blowing across the roadway?", options: ["Headlights", "High-beam headlights", "Hazard lights only"], correct: "Headlights" },
      { origin: "CA DMV Official", question: "What does a flashing yellow traffic signal light direct a driver to do?", options: ["Stop and proceed when the traffic allows you to proceed safely", "Slow down and proceed with caution", "Speed up to clear the intersection quickly"], correct: "Slow down and proceed with caution" },

      { origin: "Driving-Tests.org", question: "When turning right into a two-way street, start in the right-hand lane and enter into", options: ["any available lane.", "the far left lane.", "the lane nearest to the right edge of the road."], correct: "the lane nearest to the right edge of the road." },
      { origin: "Driving-Tests.org", question: "Which of the following right-of-way rules is FALSE?", options: ["At an intersection where there is no stop sign, yield sign, or traffic signal, drivers must yield to vehicles coming from the left.", "You must obey signals given by a law enforcement officer, even if the officer's signals contradict the traffic signals.", "At all times, drivers must yield the right-of-way to pedestrians in a marked or unmarked crosswalk."], correct: "At an intersection where there is no stop sign, yield sign, or traffic signal, drivers must yield to vehicles coming from the left." },
      { origin: "Driving-Tests.org", question: "A _________ indicates the outer edge of a roadway, and it may be crossed only by traffic moving to or from the shoulder.", options: ["solid yellow line", "broken white line", "solid white line"], correct: "solid white line" },
      { origin: "Driving-Tests.org", question: "You are driving slowly on a two-lane road. If there are at least ____ vehicles behind you that are unable to pass you, you must pull over and allow them to pass.", options: ["3", "5", "4"], correct: "5" },
      { origin: "Driving-Tests.org", question: "Flag persons are often located on highways and in work zones", options: ["to stop, slow, or guide the traffic in work zones.", "to slow vehicles to a lower speed limit posted ahead.", "to report accidents to the police department and insurance companies."], correct: "to stop, slow, or guide the traffic in work zones." },
      { origin: "Driving-Tests.org", question: "The primary traveling aids for a blind person include", options: ["a white cane and a trained guide dog.", "a white cane and a wheelchair.", "a red cane and a trained guide dog."], correct: "a white cane and a trained guide dog." },
      { origin: "Driving-Tests.org", question: "With any turning vehicle, the rear wheels follow a _________ than the front wheels.", options: ["shorter path", "longer path", "slower path"], correct: "shorter path" },
      { origin: "Driving-Tests.org", question: "Vehicles approaching a roundabout must", options: ["yield to the traffic in the roundabout.", "come to a complete stop and wait for traffic in the roundabout to clear.", "enter the roundabout to the left of the central island."], correct: "yield to the traffic in the roundabout." },
      { origin: "Driving-Tests.org", question: "If a pedestrian is in a marked or unmarked crosswalk, you must", options: ["increase your speed and cross the crosswalk quickly.", "reduce your speed and proceed with caution.", "yield to the pedestrian."], correct: "yield to the pedestrian." },
      { origin: "Driving-Tests.org", question: "On a two-way roadway with a center lane, drivers from either direction can _________ from the center lane.", options: ["park", "make left turns and U-turns", "make right turns"], correct: "make left turns and U-turns" },
      { origin: "Driving-Tests.org", question: "What is the correct hand signal for indicating a right turn?", options: ["Hand and arm extended upward", "Hand and arm extended outward", "Hand and arm extended downward"], correct: "Hand and arm extended upward" },
      { origin: "Driving-Tests.org", question: "Car drivers should NEVER", options: ["give a motorcycle the full lane.", "pass a motorcycle in the same lane.", "move to one side of your lane to give motorcyclists more room to pass."], correct: "pass a motorcycle in the same lane." },
      { origin: "Driving-Tests.org", question: "On two-lane highways, you are allowed to pass", options: ["while crossing or within 100 feet of a railroad crossing.", "when there is a broken yellow line on your side of the center dividing line.", "when you are approaching the top of a hill or are on a curve, and there is no clear view ahead."], correct: "when there is a broken yellow line on your side of the center dividing line." },
      { origin: "Driving-Tests.org", question: "When you see an emergency vehicle with its lights flashing on the wrong side of the road, giving instructions through the loudspeaker, you should", options: ["proceed slowly.", "stop immediately on the spot.", "obey the instructions."], correct: "obey the instructions." }
    ];

    const PASS_THRESHOLD = 0.83;

    let state = {
      phase: 'welcome',
      testQuestions: [],
      currentIndex: 0,
      answers: {},
      answered: false,
      questionCount: 10,
      exitPending: false,
      stats: { tests: 0, passed: 0, failed: 0, scores: [] }
    };

    const main = document.getElementById('mainContent');
    document.getElementById('questionCount').textContent = `${QUESTIONS.length} questions`;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startTest(count) {
      state.questionCount = count || state.questionCount;
      state.testQuestions = shuffle(QUESTIONS).slice(0, state.questionCount);
      state.currentIndex = 0;
      state.answers = {};
      state.answered = false;
      state.exitPending = false;
      state.phase = 'test';
      render();
    }

    function selectAnswer(qIndex, option) {
      if (state.answered) return;
      state.answers[qIndex] = option;
      state.answered = true;
      render();
    }

    function dontKnow(qIndex) {
      if (state.answered) return;
      state.answers[qIndex] = '__SKIP__';
      state.answered = true;
      render();
    }

    function nextQuestion() {
      if (state.currentIndex < state.testQuestions.length - 1) {
        state.currentIndex++;
        state.answered = state.answers[state.currentIndex] !== undefined;
        render();
      } else {
        finishTest();
      }
    }

    function prevQuestion() {
      if (state.currentIndex > 0) {
        state.currentIndex--;
        state.answered = state.answers[state.currentIndex] !== undefined;
        render();
      }
    }

    function handleExit() {
      if (state.exitPending) {
        state.phase = 'welcome';
        state.testQuestions = [];
        state.currentIndex = 0;
        state.answers = {};
        state.answered = false;
        state.exitPending = false;
        render();
      } else {
        state.exitPending = true;
        render();
      }
    }

    function finishTest() {
      let correct = 0;
      state.testQuestions.forEach((q, i) => {
        if (state.answers[i] === q.correct) correct++;
      });
      const score = correct / state.testQuestions.length;
      const passed = score >= PASS_THRESHOLD;

      state.stats.tests++;
      if (passed) state.stats.passed++;
      else state.stats.failed++;
      state.stats.scores.push(score);

      state.phase = 'results';
      state.result = { correct, total: state.testQuestions.length, score, passed };
      render();
    }

    function render() {
      if (state.phase === 'welcome') renderWelcome();
      else if (state.phase === 'test') renderTest();
      else if (state.phase === 'results') renderResults();
    }

    function renderWelcome() {
      const s = state.stats;
      const best = s.scores.length ? Math.round(Math.max(...s.scores) * 100) + '%' : '--';
      const avg = s.scores.length ? Math.round(s.scores.reduce((a, b) => a + b, 0) / s.scores.length * 100) + '%' : '--';
      const rate = s.tests ? Math.round(s.passed / s.tests * 100) + '%' : '--';

      main.innerHTML = `
        <div class="hero">
          <h2>CA DMV Practice Test</h2>
          <p>Official sample questions. You need 83% to pass.</p>
          <div class="hero-controls">
            <label>Questions</label>
            <input type="range" id="qCount" min="5" max="20" value="${state.questionCount}" oninput="document.getElementById('qVal').textContent=this.value">
            <span class="count" id="qVal">${state.questionCount}</span>
            <button class="btn btn-primary" onclick="startTest(parseInt(document.getElementById('qCount').value))">Start Test</button>
          </div>
        </div>

        <div class="stats-row">
          <div class="stat"><div class="value">${QUESTIONS.length}</div><div class="label">Questions</div></div>
          <div class="stat"><div class="value">${s.tests}</div><div class="label">Tests Taken</div></div>
          <div class="stat"><div class="value">${best}</div><div class="label">Best Score</div></div>
          <div class="stat"><div class="value">${rate}</div><div class="label">Pass Rate</div></div>
        </div>

        <div class="quick-start">
          <h3>Quick Start</h3>
          <div class="quick-buttons">
            <button class="quick-btn" onclick="startTest(5)">5 Questions</button>
            <button class="quick-btn" onclick="startTest(10)">10 Questions</button>
            <button class="quick-btn" onclick="startTest(15)">15 Questions</button>
            <button class="quick-btn" onclick="startTest(20)">20 Questions</button>
          </div>
        </div>

        <div class="quick-start">
          <h3>Session Stats</h3>
          <div style="display: flex; gap: 2rem; font-size: 0.875rem; color: var(--text-secondary);">
            <span>Avg: <strong style="color: var(--text)">${avg}</strong></span>
            <span>Passed: <strong style="color: var(--success)">${s.passed}</strong></span>
            <span>Failed: <strong style="color: var(--danger)">${s.failed}</strong></span>
          </div>
        </div>
      `;
    }

    function renderTest() {
      const q = state.testQuestions[state.currentIndex];
      const total = state.testQuestions.length;
      const idx = state.currentIndex;
      const progress = ((idx + 1) / total) * 100;
      const letters = ['A', 'B', 'C', 'D'];

      let optionsHtml = q.options.map((opt, i) => {
        let cls = 'option-btn';
        if (state.answered) {
          cls += ' disabled';
          if (opt === q.correct) cls += ' correct';
          else if (opt === state.answers[idx] && opt !== q.correct) cls += ' incorrect';
        } else if (state.answers[idx] === opt) {
          cls += ' selected';
        }
        return `<button class="${cls}" onclick="selectAnswer(${idx}, '${opt.replace(/'/g, "\\'")}')">
          <span class="option-letter">${letters[i]}</span>
          <span>${opt}</span>
        </button>`;
      }).join('');

      let feedbackHtml = '';
      if (state.answered) {
        const userAns = state.answers[idx];
        const isCorrect = userAns === q.correct;
        if (userAns === '__SKIP__') {
          feedbackHtml = `<div class="feedback incorrect">Skipped. The correct answer is: <strong>${q.correct}</strong></div>`;
        } else {
          feedbackHtml = `<div class="feedback ${isCorrect ? 'correct' : 'incorrect'}">
            ${isCorrect ? 'Correct!' : `Incorrect. The correct answer is: <strong>${q.correct}</strong>`}
          </div>`;
        }
      }

      main.innerHTML = `
        <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
        <div class="question-card">
          <div class="question-meta">
            <span>Question ${idx + 1} of ${total}</span>
            <span>${q.origin}</span>
          </div>
          <div class="question-text">${q.question}</div>
          <div class="options">${optionsHtml}</div>
          ${!state.answered ? `<button class="btn btn-dontknow" style="margin-top: 0.75rem;" onclick="dontKnow(${idx})">I don't know</button>` : ''}
          ${feedbackHtml}
        </div>
        <div class="nav-row">
          <button class="btn btn-secondary" onclick="prevQuestion()" ${idx === 0 ? 'disabled' : ''}>Previous</button>
          <button class="btn btn-primary" onclick="nextQuestion()" ${!state.answered ? 'disabled' : ''}>
            ${idx === total - 1 ? 'Finish' : 'Next'}
          </button>
          <span class="spacer"></span>
          <button class="btn btn-danger" onclick="handleExit()">${state.exitPending ? 'Confirm Exit' : 'Exit'}</button>
        </div>
      `;
    }

    function renderResults() {
      const r = state.result;
      const pct = Math.round(r.score * 100);
      const needed = Math.ceil(r.total * PASS_THRESHOLD);

      let reviewHtml = state.testQuestions.map((q, i) => {
        const userAns = state.answers[i];
        const isCorrect = userAns === q.correct;
        const isSkipped = userAns === '__SKIP__';
        return `<div class="review-item">
          <div class="q">${i + 1}. ${q.question}</div>
          <div class="a">
            Your answer: <span class="${isCorrect ? 'correct-text' : 'incorrect-text'}">${isSkipped ? 'Skipped' : (userAns || 'Not answered')}</span>
            ${!isCorrect ? `<br>Correct: <span class="correct-text">${q.correct}</span>` : ''}
          </div>
        </div>`;
      }).join('');

      main.innerHTML = `
        <div class="results-card">
          <h2>Test Complete</h2>
          <div class="score-display ${r.passed ? 'pass' : 'fail'}">${pct}%</div>
          <div class="verdict ${r.passed ? 'pass' : 'fail'}">${r.passed ? 'PASSED' : 'FAILED'}</div>
          <div style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 1rem;">
            ${r.correct} correct out of ${r.total} questions
          </div>
          <table class="results-table">
            <tr><th>Score</th><td>${pct}%</td><td style="color: var(--text-secondary)">Need ${Math.round(PASS_THRESHOLD * 100)}%</td></tr>
            <tr><th>Correct</th><td>${r.correct}</td><td style="color: var(--text-secondary)">Need ${needed}</td></tr>
            <tr><th>Wrong</th><td>${r.total - r.correct}</td><td style="color: var(--text-secondary)">Max ${r.total - needed} allowed</td></tr>
          </table>
          <button class="btn btn-primary" onclick="startTest()">Take Another Test</button>
        </div>
        <div style="font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem;">Review</div>
        ${reviewHtml}
      `;
    }

    render();
  </script>
</body>
</html>
